<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="Get in touch">
<defs>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#c026d3"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#c026d3"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#f472b6" stop-opacity="0"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
</linearGradient>
<filter id="g" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<text x="450" y="58" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="32" font-weight="700" letter-spacing="9" fill="url(#t)" filter="url(#g)">GET IN TOUCH</text>
<rect x="90" y="92" width="720" height="1.6" fill="url(#r)"><animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></rect>
<g fill="#f472b6" filter="url(#g)">
<circle cx="450" cy="92.8" r="2.4"><animate attributeName="cx" values="450;110" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.75;1" dur="3.2s" repeatCount="indefinite"/></circle>
<circle cx="450" cy="92.8" r="2.4"><animate attributeName="cx" values="450;790" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.75;1" dur="3.2s" repeatCount="indefinite"/></circle>
<circle cx="450" cy="92.8" r="3.6"><animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/></circle>
</g>
</svg>
